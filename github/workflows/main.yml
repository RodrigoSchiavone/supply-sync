name: Build Executavel Windows

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout do codigo
      uses: actions/checkout@v4

    - name: Configurar Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Instalar dependencias
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Compilar para EXE com PyInstaller
      run: |
        pyinstaller --noconfirm --onedir --console --name "GeradorEstoque" --paths "src" src/main.py

    - name: Upload do Executavel como Artefato
      uses: actions/upload-artifact@v4
      with:
        name: GeradorEstoque-Windows
        path: dist/GeradorEstoque/